version: '3'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Mmcr&mm2"
      POSTGRES_DB: miniproject

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: